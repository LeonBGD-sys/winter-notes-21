<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Für dich ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  text-align: center;
  overflow-x: hidden;
}

/* ===== PASSWORT ===== */
#password-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#password-box {
  background: #111;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 0 20px #ff4d6d;
}

#password-box input {
  padding: 10px;
  border-radius: 6px;
  border: none;
}

#password-box button {
  margin-top: 10px;
  padding: 10px 20px;
  background: #ff4d6d;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#password-error { color:#ff6b6b; margin-top:10px; }

/* ===== SAISON CANVAS ===== */
#season-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

/* ===== HERO ===== */
.hero-container {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

.hero-slide {
  position: absolute;
  inset: 0;
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}

.hero-slide.active { opacity: 1; }

.hero-text {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  text-shadow: 2px 2px 8px #000;
}

#anniversary-text {
  margin-top: 15px;
  font-size: 1.8em;
  color: #ff4d6d;
}

/* ===== HINWEISE ===== */
.hint {
  position: relative;
  z-index: 3;
  margin: 60px auto;
  max-width: 800px;
  padding: 0 20px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeInUp 1.2s forwards;
}

.hint img {
  width: 100%;
  border-radius: 12px;
  margin-top: 15px;
}

@keyframes fadeInUp {
  to { opacity:1; transform:translateY(0); }
}
</style>
</head>

<body>

<!-- 🔐 PASSWORT -->
<div id="password-overlay">
  <div id="password-box">
    <h2>🔒 Geschützt</h2>
    <input type="password" id="password-input" placeholder="Passwort">
    <br>
    <button onclick="checkPassword()">Öffnen</button>
    <div id="password-error"></div>
  </div>
</div>

<canvas id="season-canvas"></canvas>

<div class="hero-container" id="hero-container">
  <div class="hero-text">
    <h1>Für dich ❤️</h1>
    <p>Jeden Monat ein kleiner Hinweis…</p>
    <div id="hero-countdown"></div>
    <div id="anniversary-text"></div>
  </div>
</div>

<div id="hints-container"></div>

<audio id="bg-music" loop>
  <source src="Send Me On My Way.mp3" type="audio/mpeg">
</audio>

<script>
/************* BASIS *************/
const TEST_MODE = false;
const PASSWORD = "21Stephie-Leon01";
const now = new Date();

/************* PASSWORT *************/
function checkPassword(){
  const input=document.getElementById("password-input").value;
  if(input===PASSWORD){
    document.getElementById("password-overlay").style.display="none";
    startSite();
  } else {
    document.getElementById("password-error").innerText="❌ Falsches Passwort";
  }
}

/************* DATEN *************/
function isTodayOrAfter(dateStr){
  const today=new Date();
  const d=new Date(dateStr);
  return today >= d;
}

/************* JAHRESTAG *************/
function isAnniversary(){
  return now.getDate()===21 && now.getMonth()===0; // 21. Januar jedes Jahr
}

/************* SAISON + GEBURTSTAG *************/
function isBirthday() {
  return now.getDate()===10 && now.getMonth()===3;
}

function getSeason(){
  const m=now.getMonth(), d=now.getDate();
  if(m<=2||(m===3&&d<=15)) return "winter";
  if(m<=5) return "spring";
  if(m<=8) return "summer";
  return "autumn";
}
const season = getSeason();

/************* TAGESSTIMMUNG *************/
const hour = now.getHours();
let mood = hour<6||hour>=22 ? 0.5 : hour<10 ? 0.8 : hour<18 ? 1 : 0.7;

/************* CANVAS *************/
const canvas = document.getElementById("season-canvas");
const ctx = canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
window.addEventListener("resize",resize);resize();

/************* PARTIKEL *************/
let particles=[];
const count = isBirthday()?180:120;

function createParticle(){
  let color;
  if(isAnniversary()) color=`rgba(255,80,120,${Math.random()})`;       // ❤️ Herzen-Modus
  else if(season==="winter") color=`rgba(255,255,255,${0.8*mood})`;   // Schnee
  else if(season==="spring") color=`rgba(255,180,200,${0.6*mood})`;   // Blüten
  else if(season==="summer") color=`rgba(255,255,200,${0.5*mood})`;   // Sommerlicht
  else color=`rgba(200,120,40,${0.7*mood})`;                          // Herbst

  return {
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*4+2,
    speedY:Math.random()*1.2+0.3,
    speedX:(Math.random()-0.5)*0.6,
    color
  };
}
for(let i=0;i<count;i++)particles.push(createParticle());

let mouseX=0;
document.addEventListener("mousemove",e=>mouseX=e.clientX);

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.y+=p.speedY;
    p.x+=p.speedX+(mouseX-canvas.width/2)*0.00005;
    if(p.y>canvas.height){p.y=0;p.x=Math.random()*canvas.width;}
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();

/************* HERO SLIDESHOW *************/
let bgs=[];
for(let i=1;i<=20;i++)bgs.push(`Hintergrund${String(i).padStart(2,'0')}.png`);
bgs.sort(()=>Math.random()-0.5);
const hero=document.getElementById("hero-container");
bgs.forEach(bg=>{
  const d=document.createElement("div");
  d.className="hero-slide";
  d.style.backgroundImage=`url(${bg})`;
  hero.appendChild(d);
});
let slides=document.querySelectorAll(".hero-slide"),cur=0;
slides[cur].classList.add("active");
setInterval(()=>{
  slides[cur].classList.remove("active");
  cur=(cur+1)%slides.length;
  slides[cur].classList.add("active");
},8000);

/************* MUSIK *************/
let started=false;
document.addEventListener("click",()=>{
  if(!started){document.getElementById("bg-music").play();started=true;}
});

/************* HINWEISE *************/
const hintDates = ["2026-01-21"];
for (let m = 1; m < 12; m++) {
  const d = Math.floor(Math.random()*20)+5;
  hintDates.push(new Date(2026, m, d).toISOString().split("T")[0]);
}

const hints = [
  { title:"Januar ❤️", text:"Hier kommt dein erster Hinweis…", img:"hinweis01.png" },
  { title:"Februar ❤️", text:"Der zweite kleine Hinweis wartet…", img:"hinweis02.png" },
  { title:"März ❤️", text:"Ein neuer Monat, ein neuer Hinweis…", img:"hinweis03.png" },
  { title:"April ❤️", text:"Vielleicht erinnerst du dich…", img:"hinweis04.png" },
  { title:"Mai ❤️", text:"Ein weiterer Hinweis für dich…", img:"hinweis05.png" },
  { title:"Juni ❤️", text:"Halbzeit…", img:"hinweis06.png" },
  { title:"Juli ❤️", text:"Sommer & Erinnerungen…", img:"hinweis07.png" },
  { title:"August ❤️", text:"Warm wie dieser Monat…", img:"hinweis08.png" },
  { title:"September ❤️", text:"Der Herbst kommt näher…", img:"hinweis09.png" },
  { title:"Oktober ❤️", text:"Ein geheimnisvoller Hinweis…", img:"hinweis10.png" },
  { title:"November ❤️", text:"Fast am Ziel…", img:"hinweis11.png" },
  { title:"24. Dezember 🎄❤️", text:"Der letzte Hinweis…", img:"hinweis12.png" }
];

function startSite(){

/* 🎉 JAHRESTAGS-TEXT */
if(isAnniversary()){
  document.getElementById("anniversary-text").innerHTML="Alles Gute zum Jahrestag ❤️";
}

}
</script>

</body>
</html>
