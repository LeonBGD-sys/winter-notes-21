<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Für dich ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  text-align: center;
  overflow-x: hidden;
}

/* ===== PASSWORT OVERLAY ===== */
#password-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, #111, #000);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#password-box {
  background: rgba(255,255,255,0.08);
  border: 2px solid #ffb6c1;
  border-radius: 16px;
  padding: 30px 35px;
  box-shadow: 0 0 30px rgba(255,182,193,0.25);
  max-width: 320px;
  width: 90%;
}

#password-box h2 {
  margin-top: 0;
  color: #ffb6c1;
}

#password-box input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 1em;
  margin-top: 10px;
  outline: none;
}

#password-box button {
  margin-top: 15px;
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  font-size: 1em;
  cursor: pointer;
  background: #ffb6c1;
  color: #000;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

#password-box button:hover {
  transform: scale(1.05);
  opacity: 0.9;
}

#password-error {
  color: #ff7b9c;
  margin-top: 10px;
  min-height: 1.2em;
}

/* ===== SEASON CANVAS ===== */
#season-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

/* ===== HERO ===== */
.hero-container {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

.hero-slide {
  position: absolute;
  inset: 0;
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #000;
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
  z-index: 0;
}

.hero-slide.active {
  opacity: 1;
}

.hero-text {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-shadow: 2px 2px 6px #000;
  z-index: 3;
}

.hero-text h1 {
  font-size: 2.8em;
  margin: 0;
}

.hero-text p {
  font-size: 1.2em;
  margin-top: 5px;
}

#hero-countdown {
  margin-top: 10px;
  font-size: 1.1em;
  font-style: italic;
  opacity: 0.9;
}

#anniversary-text {
  margin-top: 12px;
  font-size: 1.5em;
  color: #ffb6c1;
  font-weight: bold;
  animation: fadeInUp 2s ease forwards;
}

/* ===== HINTS ===== */
.hint {
  position: relative;
  z-index: 3;
  margin: 60px auto;
  max-width: 800px;
  padding: 0 20px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeInUp 1.2s ease forwards;
}

.hint img {
  width: 100%;
  border-radius: 12px;
  margin-top: 15px;
}

.envelope {
  background: rgba(255,255,255,0.08);
  border: 2px dashed #ffb6c1;
  border-radius: 14px;
  padding: 30px;
  cursor: pointer;
  transition: transform 0.3s ease, background 0.3s ease;
}

.envelope:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.15);
}

.envelope span {
  font-size: 1.4em;
  color: #ffb6c1;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp {
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- ===== PASSWORT SPERRE ===== -->
<div id="password-overlay">
  <div id="password-box">
    <h2>🔒 Geschützte Seite</h2>
    <p>Bitte gib das Passwort ein ❤️</p>
    <input type="password" id="password-input" placeholder="Passwort">
    <button onclick="checkPassword()">Öffnen</button>
    <div id="password-error"></div>
  </div>
</div>

<canvas id="season-canvas"></canvas>

<div class="hero-container" id="hero-container" style="display:none;">
  <div class="hero-text">
    <h1>Für dich ❤️</h1>
    <p>Jeden Monat ein kleiner Hinweis…</p>
    <div id="hero-countdown"></div>
    <div id="anniversary-text"></div>
  </div>
</div>

<div id="hints-container" style="display:none;"></div>

<audio id="bg-music" loop>
  <source src="Send Me On My Way.mp3" type="audio/mpeg">
</audio>

<script>
/*************** PASSWORT ***************/
const PASSWORD = "21Stephie-Leon01";

function checkPassword(){
  const input = document.getElementById("password-input").value;
  const error = document.getElementById("password-error");

  if(input === PASSWORD){
    sessionStorage.setItem("siteUnlocked", "true");
    document.getElementById("password-overlay").style.display = "none";
    document.getElementById("hero-container").style.display = "block";
    document.getElementById("hints-container").style.display = "block";
    startSite();
  } else {
    error.innerText = "❌ Falsches Passwort";
  }
}

if(sessionStorage.getItem("siteUnlocked")==="true"){
  document.getElementById("password-overlay").style.display = "none";
  document.getElementById("hero-container").style.display = "block";
  document.getElementById("hints-container").style.display = "block";
  startSite();
}

/*************** HAUPTLOGIK ***************/
function startSite(){

const TEST_MODE = true;
const ANNIVERSARY_DATE = "2026-01-21";

const now = new Date();
const todayStr = now.toISOString().split("T")[0];
const isAnniversary = todayStr === ANNIVERSARY_DATE;

if(isAnniversary){
  document.getElementById("anniversary-text").innerText =
    "Alles Liebe zum Jahrestag ❤️";
}

/*************** HINWEISE ***************/
const hints = [
  { title: "Januar ❤️", text: "Hier kommt dein erster Hinweis…", img: "hinweis01.png" },
  { title: "Februar ❤️", text: "Der zweite kleine Hinweis wartet…", img: "hinweis02.png" },
  { title: "März ❤️", text: "Ein neuer Monat, ein neuer Hinweis…", img: "hinweis03.png" },
  { title: "April ❤️", text: "Vielleicht erinnerst du dich…", img: "hinweis04.png" },
  { title: "Mai ❤️", text: "Ein weiterer Hinweis für dich…", img: "hinweis05.png" },
  { title: "Juni ❤️", text: "Halbzeit…", img: "hinweis06.png" },
  { title: "Juli ❤️", text: "Sommer & Erinnerungen…", img: "hinweis07.png" },
  { title: "August ❤️", text: "Warm wie dieser Monat…", img: "hinweis08.png" },
  { title: "September ❤️", text: "Der Herbst kommt näher…", img: "hinweis09.png" },
  { title: "Oktober ❤️", text: "Ein geheimnisvoller Hinweis…", img: "hinweis10.png" },
  { title: "November ❤️", text: "Fast am Ziel…", img: "hinweis11.png" },
  { title: "24. Dezember 🎄❤️", text: "Der letzte Hinweis…", img: "hinweis12.png" }
];

const container = document.getElementById("hints-container");

hints.forEach((hint, i) => {
  if (TEST_MODE || i === 0) {
    const div = document.createElement("div");
    div.className = "hint";

    if(i === 0){
      div.innerHTML = `
        <div class="envelope" id="envelope">
          <span>💌 Öffne den ersten Hinweis</span>
        </div>
      `;
      container.appendChild(div);

      div.querySelector("#envelope").addEventListener("click", () => {
        div.innerHTML = `
          <h2>${hint.title}</h2>
          <p>${hint.text}</p>
          <img src="${hint.img}">
        `;
      });
    } else {
      div.innerHTML = `<h2>${hint.title}</h2><p>${hint.text}</p><img src="${hint.img}">`;
      container.appendChild(div);
    }
  }
});

/*************** SLIDESHOW ***************/
let backgrounds = [];
for(let i=1;i<=20;i++){
  backgrounds.push(`Hintergrund${i.toString().padStart(2,'0')}.png`);
}
backgrounds = backgrounds.sort(() => Math.random() - 0.5);

const heroContainer = document.getElementById("hero-container");

backgrounds.forEach(bg => {
  const div = document.createElement("div");
  div.className = "hero-slide";
  div.style.backgroundImage = `url(${bg})`;
  heroContainer.appendChild(div);
});

let slides = document.querySelectorAll(".hero-slide");
let current = 0;
slides[current].classList.add("active");

setInterval(() => {
  slides[current].classList.remove("active");
  current = (current+1) % slides.length;
  slides[current].classList.add("active");
}, 8000);

/*************** MUSIK ***************/
let started = false;
document.addEventListener("click", () => {
  if(!started){
    document.getElementById("bg-music").play();
    started = true;
  }
});

/*************** SAISON EFFEKTE ***************/
const canvas = document.getElementById("season-canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function isBirthday(){
  return now.getDate()===10 && now.getMonth()===3;
}

function getSeason(){
  if(isAnniversary || isBirthday()) return "hearts";
  const m = now.getMonth(), d = now.getDate();
  if(m<=2 || (m===3 && d<=15)) return "winter";
  if(m<=5) return "spring";
  if(m<=8) return "summer";
  return "autumn";
}

const season = getSeason();
let particles = [];
const amount = 140;

function createParticle(){
  let color;
  if(season==="hearts") color="rgba(255,80,120,0.8)";
  else if(season==="winter") color="rgba(255,255,255,0.8)";
  else if(season==="spring") color="rgba(255,180,200,0.6)";
  else if(season==="summer") color="rgba(255,255,200,0.5)";
  else color="rgba(200,120,40,0.7)";

  return {
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*5+3,
    speedY:Math.random()*1.2+0.5,
    speedX:(Math.random()-0.5)*0.6,
    color
  };
}

for(let i=0;i<amount;i++) particles.push(createParticle());

function drawHeart(x,y,size){
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x-size/2, y-size/2, x-size, y+size/3, x, y+size);
  ctx.bezierCurveTo(x+size, y+size/3, x+size/2, y-size/2, x, y);
  ctx.fill();
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.y+=p.speedY;
    p.x+=p.speedX;
    if(p.y>canvas.height){p.y=0;p.x=Math.random()*canvas.width;}

    ctx.fillStyle=p.color;
    if(season==="hearts"){
      drawHeart(p.x,p.y,p.size);
    } else {
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();
    }
  });
  requestAnimationFrame(animate);
}
animate();

} // end startSite
</script>

</body>
</html>
