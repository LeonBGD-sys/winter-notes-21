<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Für dich ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  text-align: center;
  overflow-x: hidden;
}

/* ===== PASSWORT ===== */
#password-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#password-box {
  background: #111;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 0 20px #ff4d6d;
}

#password-box input {
  padding: 10px;
  border-radius: 6px;
  border: none;
}

#password-box button {
  margin-top: 10px;
  padding: 10px 20px;
  background: #ff4d6d;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#password-error { color:#ff6b6b; margin-top:10px; }

/* ===== HERO ===== */
.hero-container {
  position: relative;
  height: 100vh;
  overflow: hidden;
}

.hero-slide {
  position: absolute;
  inset: 0;
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #000;
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
  z-index: -1;
}

.hero-slide.active { opacity: 1; }

.hero-text {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-shadow: 2px 2px 6px #000;
  z-index: 2;
}

/* ===== HINWEISE ===== */
.hint {
  margin: 60px auto;
  max-width: 800px;
  padding: 0 20px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeInUp 1.2s ease forwards;
}

.hint img {
  width: 100%;
  border-radius: 12px;
  margin-top: 15px;
}

@keyframes fadeInUp {
  to { opacity:1; transform:translateY(0); }
}

/* ===== PARTIKEL ===== */
.particle {
  position: fixed;
  top: -10px;
  pointer-events: none;
  animation: fall linear infinite;
  z-index: 1000;
}

@keyframes fall {
  to { transform: translateY(110vh); opacity:0; }
}
</style>
</head>

<body>

<div id="password-overlay">
  <div id="password-box">
    <h2>🔒 Geschützt</h2>
    <input type="password" id="password-input" placeholder="Passwort">
    <br>
    <button onclick="checkPassword()">Öffnen</button>
    <div id="password-error"></div>
  </div>
</div>

<div class="hero-container" id="hero-container">
  <div class="hero-text">
    <h1>Für dich ❤️</h1>
    <p>Jeden Monat ein kleiner Hinweis…</p>
    <div id="hero-countdown"></div>
    <div id="anniversary-text"></div>
  </div>
</div>

<div id="hints-container"></div>

<audio id="bg-music" loop>
  <source src="Send Me On My Way.mp3" type="audio/mpeg">
</audio>

<script>
const TEST_MODE = false;
const PASSWORD = "21Stephie-Leon01";

const overlay = document.getElementById("password-overlay");
const hero = document.getElementById("hero-container");
const hintsBox = document.getElementById("hints-container");

if (TEST_MODE) {
  overlay.style.display = "flex";
  hero.style.display = "none";
  hintsBox.style.display = "none";
} else {
  startSite();
}

function checkPassword(){
  const input = document.getElementById("password-input").value;
  if(input === PASSWORD){
    overlay.style.display="none";
    hero.style.display="block";
    hintsBox.style.display="block";
    startSite();
  } else {
    document.getElementById("password-error").innerText="❌ Falsches Passwort";
  }
}

/* DATUM */
function isTodayOrAfter(dateStr){
  const today = new Date();
  const d = new Date(dateStr);
  return today >= d;
}

/* JAHRESTAG */
function isAnniversary(){
  const now = new Date();
  return now.getDate()===21 && now.getMonth()===0;
}

function startSite(){

/* 🎉 JAHRESTAGS TEXT */
if(isAnniversary()){
  document.getElementById("anniversary-text").innerHTML =
    "<h2 style='color:#ff4d6d;'>Alles Gute zum Jahrestag ❤️</h2>";
}

/* ❄️ SCHNEE IMMER */
function startSnow() {
  setInterval(() => {
    const snow = document.createElement("div");
    snow.className = "particle";
    snow.innerHTML = "❄️";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.fontSize = Math.random() * 15 + 10 + "px";
    snow.style.animationDuration = Math.random() * 5 + 5 + "s";
    document.body.appendChild(snow);
    setTimeout(() => snow.remove(), 10000);
  }, 400);
}
startSnow();

/* ❤️ HERZEN NUR HEUTE */
if(isAnniversary()){
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "particle";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 25 + 15 + "px";
    heart.style.animationDuration = Math.random() * 4 + 4 + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
  }, 300);
}

/* HINWEIS DATEN */
const hintDates = ["2026-01-21"];
for (let m = 1; m < 12; m++) {
  const d = Math.floor(Math.random()*20)+5;
  hintDates.push(new Date(2026, m, d).toISOString().split("T")[0]);
}

const hints = [
  { title:"Januar ❤️", text:"Hier kommt dein erster Hinweis…", img:"hinweis01.png" },
  { title:"Februar ❤️", text:"Der zweite kleine Hinweis wartet…", img:"hinweis02.png" },
  { title:"März ❤️", text:"Ein neuer Monat, ein neuer Hinweis…", img:"hinweis03.png" },
  { title:"April ❤️", text:"Vielleicht erinnerst du dich…", img:"hinweis04.png" },
  { title:"Mai ❤️", text:"Ein weiterer Hinweis für dich…", img:"hinweis05.png" },
  { title:"Juni ❤️", text:"Halbzeit…", img:"hinweis06.png" },
  { title:"Juli ❤️", text:"Sommer & Erinnerungen…", img:"hinweis07.png" },
  { title:"August ❤️", text:"Warm wie dieser Monat…", img:"hinweis08.png" },
  { title:"September ❤️", text:"Der Herbst kommt näher…", img:"hinweis09.png" },
  { title:"Oktober ❤️", text:"Ein geheimnisvoller Hinweis…", img:"hinweis10.png" },
  { title:"November ❤️", text:"Fast am Ziel…", img:"hinweis11.png" },
  { title:"24. Dezember 🎄❤️", text:"Der letzte Hinweis…", img:"hinweis12.png" }
];

const container = document.getElementById("hints-container");

/* ERSTER HINWEIS MIT UMSCHLAG */
if (isTodayOrAfter(hintDates[0])) {
  const env = document.createElement("div");
  env.className = "hint";
  env.innerHTML = `
    <div style="border:2px solid #ff4d6d;padding:30px;border-radius:12px;cursor:pointer;background:#111;max-width:300px;margin:0 auto;">
      💌 <strong>Öffne den ersten Hinweis</strong>
    </div>`;
  env.onclick = () => {
    env.remove();
    showHint(0);
  };
  container.appendChild(env);
}

function showHint(i){
  const h = hints[i];
  const div = document.createElement("div");
  div.className="hint";
  div.innerHTML=`<h2>${h.title}</h2><p>${h.text}</p><img src="${h.img}">`;
  container.appendChild(div);
}

/* SLIDESHOW */
let backgrounds=[];
for(let i=1;i<=20;i++) backgrounds.push(`Hintergrund${i.toString().padStart(2,'0')}.png`);
backgrounds.sort(()=>Math.random()-0.5);

const heroContainer=document.getElementById("hero-container");
backgrounds.forEach(bg=>{
  const div=document.createElement("div");
  div.className="hero-slide";
  div.style.backgroundImage=`url(${bg})`;
  heroContainer.appendChild(div);
});

let slides=document.querySelectorAll(".hero-slide");
let current=0;
slides[current].classList.add("active");

setInterval(()=>{
  slides[current].classList.remove("active");
  current=(current+1)%slides.length;
  slides[current].classList.add("active");
},8000);

/* MUSIK */
let started=false;
document.addEventListener("click",()=>{
  if(!started){
    document.getElementById("bg-music").play();
    started=true;
  }
});

}
</script>

</body>
</html>
